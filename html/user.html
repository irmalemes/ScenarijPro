<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScenarijPro - Postavke korisničkog računa</title>
  <link rel="stylesheet" href="../css/user.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Inter&display=swap" rel="stylesheet">
</head>
<body>

  <div class="settings-container">
    <h1>Postavke korisničkog računa</h1>
    <hr class="blue-line">
    <p class="subtitle"><i>Upravljajte vašim korisničkim računom, sigurnosnim postavkama i notifikacijama.</i></p>

    <form class="settings-form">

  
      <section class="form-section account">
        <h2>Podaci o korisničkom računu</h2>

        <label for="fullname">Ime i prezime</label>
        <input type="text" id="fullname" placeholder="Ime i prezime">

        <label for="email">Email adresa</label>
        <input type="email" id="email" placeholder="Email adresa">

        <label for="items">Broj elemenata po stranici (1–100)</label>
        <input type="number" id="items" min="1" max="100" value="" placeholder="Broj elemenata">
      </section>

      
      <section class="form-section security">
        <h2>Sigurnosne postavke</h2>

        <label for="password">Nova šifra</label>
        <input type="password" id="password" placeholder="Nova šifra">

        <div class="checkbox-group">
          <input type="checkbox" id="twofa">
          <label for="twofa">Omogući Two-Factor Authentication (2FA)</label>
        </div>
      </section>

      <section class="form-section notifications">
        <h2>Notifikacije</h2>

        <p class="label">Preferirani način komunikacije</p>
        <div class="radio-group">
          <label><input type="radio" name="contact" checked> Email</label>
          <label><input type="radio" name="contact"> SMS (tekst)</label>
          <label><input type="radio" name="contact"> None</label>
        </div>

        <p class="label">Frekvencija notifikacija</p>
        <select id="frequency">
          <option selected>Dnevno</option>
          <option>Sedmično</option>
          <option>Mjesečno</option>
          <option>Nikad</option>
        </select>
      </section>

      <button type="submit" class="save-btn">Spasi promjene</button>
    </form>
  </div>

</body>
</html>
